name: IranUK News Monitor
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send Persian translation test to Telegram"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send manual translation test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_CHANNEL: "@iranuknews"
        run: python test_translation.py
      - name: Check news, translate and publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_CHANNEL: "@iranuknews"
        run: python bot.py
      - name: Save deduplication state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        run: |
          git config user.name "iranuknews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git pull --rebase origin main && git push)
